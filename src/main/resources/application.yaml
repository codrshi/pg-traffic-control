debug: true

spring:
  application:
    name: pg-traffic-control
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:postgresql://localhost:5432/pg_traffic_control
    username: flight_admin
    password: mysecretpassword
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

debezium:
  datasource:
    host: localhost
    port: 5432
    user: flight_admin
    password: mysecretpassword
    database: pg_traffic_control
  offset:
    storage:
      file:
        filename: ./offsets.dat
  schema:
    history:
      internal:
        file:
          filename: ./schema_history.dat

